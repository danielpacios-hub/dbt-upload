version: 2

models:
  - name: stg_customer
    columns:
      - name: custkey
        data_tests:
          - not_null
          - unique

  - name: stg_lineitem
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - orderkey
              - partkey
              - suppkey
              - linenumber


  - name: stg_nation
    columns:
      - name: nationkey
        data_tests:
          - not_null
          - unique

  - name: stg_order
    columns:
      - name: orderkey
        data_tests:
          - not_null
          - unique

  - name: stg_part
    columns:
      - name: partkey
        data_tests:
          - not_null
          - unique

  - name: stg_partsupp
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - partkey
              - suppkey

  - name: stg_region
    columns:
      - name: regionkey
        data_tests:
          - not_null
          - unique

  - name: stg_supplier
    columns:
      - name: suppkey
        data_tests:
          - not_null
          - unique

